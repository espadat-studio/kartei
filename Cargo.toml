[package]
name = "kartei"
version = "2.0.0"
categories = ["command-line-utilities", "email"]
edition = "2024"
keywords = ["vcard", "contacts", "tui", "carddav", "address-book"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/espadat-studio/kartei"
description = "Terminal address book for vCard files. Edits touch only the lines you change, so Apple and CardDAV extras survive the next sync."

[dev-dependencies]
proptest = "1.11.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
notify-debouncer-full = "0.7.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
uuid = { version = "1.26.1", features = ["v4"] }
