[tasks.build]
alias = "b"
run = "cargo build --release"

[tasks.test]
alias = "t"
run = "cargo nextest run"

[tasks.check-format]
run = "dprint check"

[tasks.check-rustfmt]
run = "cargo fmt -- --check"

[tasks.check-clippy]
run = "cargo clippy --all-targets -- -D warnings"

[tasks.check]
alias = "c"
depends = ["check-*"]

[tools]
"cargo:cargo-nextest" = "0.9.149"
"cargo:convco" = "0.7.2"
"aqua:dprint/dprint" = "0.64.3"
hk = "2.8.1"
node = "24.22.1"
pkl = "0.32.2"
rust = { version = "1.99.1", components = "clippy,rustfmt" }
