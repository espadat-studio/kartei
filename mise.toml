[tasks.build]
alias = "b"
run = "cargo build --release"

[tasks.test]
alias = "t"
run = "cargo nextest run"

[tasks.check-format]
run = "dprint check"

[tasks.check-rustfmt]
run = "cargo fmt -- --check"

[tasks.check-clippy]
run = "cargo clippy --all-targets -- -D warnings"

[tasks.check]
alias = "c"
depends = ["check-*"]

[tools]
"cargo:cargo-nextest" = "0.9.152"
"cargo:convco" = "0.7.2"
"aqua:dprint/dprint" = "0.64.3"
hk = "2.12.0"
node = "26.13.1"
pkl = "0.33.0"
rust = { version = "1.100.0", components = "clippy,rustfmt" }
